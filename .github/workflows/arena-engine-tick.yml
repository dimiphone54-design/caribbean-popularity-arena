name: Arena Engine scheduled rotation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arena-engine-scheduled-rotation
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call protected Arena Engine tick
        env:
          ARENA_ENGINE_BOT_SECRET: ${{ secrets.ARENA_ENGINE_BOT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${ARENA_ENGINE_BOT_SECRET:-}" ]; then
            echo "Missing repository secret ARENA_ENGINE_BOT_SECRET."
            exit 1
          fi
          curl --fail --silent --show-error \
            --max-time 30 \
            -H "x-caribbean-slots-secret: ${ARENA_ENGINE_BOT_SECRET}" \
            "https://caribbean-freedom-arena.vercel.app/api/arena-engine/tick"
