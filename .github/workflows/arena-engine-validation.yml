name: Arena Engine validation

on:
  push:
    branches:
      - fix/arena-engine-production-safety
    paths:
      - "src/lib/arena-engine/**"
      - "src/app/api/arena-engine/**"
      - "src/lib/arena-slot-sign-in-access.ts"
      - "src/lib/arena-front12-slot-order.ts"
      - ".github/workflows/arena-engine-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/arena-engine/**"
      - "src/app/api/arena-engine/**"
      - "src/lib/arena-slot-sign-in-access.ts"
      - "src/lib/arena-front12-slot-order.ts"
      - ".github/workflows/arena-engine-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Arena Engine lint
        run: >-
          npx eslint
          src/lib/arena-engine
          src/app/api/arena-engine
          src/lib/arena-slot-sign-in-access.ts
          src/lib/arena-front12-slot-order.ts
